<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM - Lava Jato do David</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gold: '#D4AF37', darkBg: '#0F0F0F', cardBg: '#1A1A1A' } } }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen p-6 relative pb-20">

<div th:if="${!autenticado}" class="max-w-md mx-auto bg-cardBg border border-gold/30 p-8 rounded-2xl shadow-2xl mt-20">
    <h2 class="text-2xl font-bold text-gold text-center mb-6">Acesso Administrativo</h2>
    <form action="/admin" method="get" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Digite a Senha do Dono:</label>
            <input type="password" name="senha" required placeholder="Sua senha de acesso" class="w-full bg-black border border-gray-700 rounded-lg p-3 text-white outline-none focus:border-gold">
        </div>
        <button type="submit" class="w-full bg-gold text-black font-extrabold p-3 rounded-lg hover:bg-yellow-500">Entrar no Painel</button>
    </form>
</div>

<div th:if="${autenticado}" class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8 border-b border-gold/20 pb-4">
        <h1 class="text-3xl font-bold text-gold">Painel do Administrador (David)</h1>
        <a href="/admin" class="text-xs bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1 rounded hover:bg-red-500/40">Sair</a>
    </div>

    <!-- TABELA DE AGENDAMENTOS -->
    <div class="mb-12">
        <h3 class="text-xl font-bold mb-4 text-white flex items-center gap-2">
            <span>📅</span> Horários Agendados pelos Clientes
        </h3>
        <div class="bg-cardBg border border-gold/20 rounded-xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                    <tr class="bg-black/60 text-gold text-xs uppercase border-b border-gray-800">
                        <th class="p-4">Cliente</th>
                        <th class="p-4">Telefone</th>
                        <th class="p-4">Veículo / Serviço</th>
                        <th class="p-4">Data e Horário</th>
                        <th class="p-4">Valor</th>
                        <th class="p-4 text-center">Ações</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800 text-sm">
                    <tr th:each="agendamento : ${agendamentos}" class="hover:bg-white/5 transition">
                        <td class="p-4 font-bold text-white" th:text="${agendamento.nomeCliente}"></td>
                        <td class="p-4 text-gray-300" th:text="${agendamento.telefoneCliente}"></td>
                        <td class="p-4">
                            <span class="text-gold font-semibold" th:text="${agendamento.tipoVeiculo}"></span> -
                            <span class="text-gray-300" th:text="${agendamento.modeloVeiculo}"></span><br>
                            <span class="text-xs text-gray-400" th:text="${agendamento.tipoServico}"></span>
                        </td>
                        <td class="p-4">
                            <span class="font-bold text-white" th:text="${agendamento.dataAgendamento}"></span> às
                            <span class="text-gold font-bold" th:text="${agendamento.horarioAgendamento}"></span>
                        </td>
                        <td class="p-4 font-bold text-gold" th:text="'R$ ' + ${agendamento.valorTotal}"></td>
                        <td class="p-4 text-center">
                            <form action="/admin/agendamento/deletar" method="post" onsubmit="return confirm('Deseja realmente concluir ou cancelar este agendamento?');">
                                <input type="hidden" name="senha" value="david123">
                                <input type="hidden" name="id" th:value="${agendamento.id}">
                                <button type="submit" class="bg-red-600/20 text-red-400 border border-red-500/30 text-xs px-3 py-1 rounded hover:bg-red-600 hover:text-white font-bold transition">Concluir / Excluir</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(agendamentos)}">
                        <td colspan="6" class="p-6 text-center text-gray-500">Nenhum agendamento registrado até o momento.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FORMULÁRIO DE GALERIA -->
    <div class="bg-cardBg p-6 rounded-xl border border-gold/30 mb-10">
        <h3 class="text-lg font-bold mb-4 text-white">Publicar Nova Foto na Galeria</h3>
        <form action="/admin/galeria/adicionar" method="post" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="senha" value="david123">

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Título do Veículo / Trabalho</label>
                <input type="text" name="titulo" placeholder="Ex: Fan 160 Preto Fosco - Lavagem Detalhada" required class="w-full bg-black border border-gray-700 rounded p-3 text-white">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Categoria</label>
                    <select name="categoria" class="w-full bg-black border border-gray-700 rounded p-3 text-white">
                        <option value="MOTO">Moto</option>
                        <option value="CARRO">Carro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Escolher Foto do Notebook</label>
                    <input type="file" name="arquivoImagem" accept="image/*" required class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gold file:text-black hover:file:bg-yellow-500 cursor-pointer">
                </div>
            </div>

            <button type="submit" class="bg-gold text-black font-extrabold px-6 py-3 rounded-lg hover:bg-yellow-500 w-full mt-4">Publicar Imagem</button>
        </form>
    </div>

    <!-- FOTOS DA GALERIA -->
    <h3 class="text-xl font-bold mb-4 text-white">Fotos Publicadas no Site</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div th:each="foto : ${fotos}" class="bg-cardBg border border-gold/20 rounded-xl overflow-hidden shadow-lg">
            <img th:src="${foto.urlImagem}" class="w-full h-48 object-cover">
            <div class="p-4 flex justify-between items-center">
                <div>
                    <span class="text-xs text-gold font-bold" th:text="${foto.categoria}"></span>
                    <h4 class="font-bold text-white text-sm" th:text="${foto.titulo}"></h4>
                </div>
                <form action="/admin/galeria/deletar" method="post">
                    <input type="hidden" name="senha" value="david123">
                    <input type="hidden" name="id" th:value="${foto.id}">
                    <button type="submit" class="bg-red-600 text-white text-xs px-3 py-2 rounded hover:bg-red-700 font-bold">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Botão Flutuante do WhatsApp do David -->
<a href="https://wa.me/5579999248255?text=Olá%20David!%20Gostaria%20de%20tirar%20algumas%20dúvidas%20sobre%20os%20horários%20e%20serviços%20do%20Lava%20Jato."
   target="_blank"
   class="fixed bottom-6 right-6 bg-green-500 hover:bg-green-600 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition transform hover:scale-110 z-50">

</body>
</html>

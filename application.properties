spring.application.name=Lava Jato do David

# Configuração do Banco de Dados H2
spring.datasource.url=jdbc:h2:file:./data/lavajato_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Atualiza tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Limite para envio de fotos na galeria
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB